# Winterrealm3 home stack. Start it through the platform helper
# (scripts/windows/start.ps1 or scripts/linux/start.sh): the helper renders the
# host-specific configuration mounted from deploy/generated first.

name: winterrealm3

# The companion code lives in official/, so the login and game services run
# one image built from it rather than the prebuilt jars under deploy/.
x-l2j-build: &l2j-build
  context: .
  dockerfile: Dockerfile.l2j

services:
  l2j-db:
    image: docker.io/library/mariadb:10.5
    container_name: winterrealm3-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: l2jroot
      MARIADB_USER: l2j
      MARIADB_PASSWORD: l2jserver2019
    ports:
      # Loopback only: maintenance tools on the host may reach the database,
      # other machines on the network may not.
      - "127.0.0.1:3307:3306"
    volumes:
      - winterrealm3-db:/var/lib/mysql
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
      - ./official:/opt/l2j/official:ro
    healthcheck:
      # --connect fails while the first-run SQL import runs, because the image
      # keeps networking off until initialization has finished.
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 30s

  l2j-login:
    image: localhost/winterrealm3-local:${L2J_IMAGE_TAG:-dev}
    build: *l2j-build
    container_name: winterrealm3-login
    restart: unless-stopped
    working_dir: /opt/l2j/login
    command: ["java", "-Xms128m", "-Xmx256m", "-jar", "l2jlogin.jar"]
    depends_on:
      l2j-db:
        condition: service_healthy
    ports:
      - "${L2J_BIND_IP:-0.0.0.0}:2106:2106"
    volumes:
      - ./deploy/login/log:/opt/l2j/login/log
      - ./deploy/generated/login/config:/opt/l2j/login/config
    healthcheck:
      # The login server opens the player port after the game-server port, so
      # an open 2106 means game servers can register too. Probing 9014
      # instead would log a dropped game-server link on every check.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2106"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  l2j-game:
    image: localhost/winterrealm3-local:${L2J_IMAGE_TAG:-dev}
    build: *l2j-build
    container_name: winterrealm3-game
    restart: unless-stopped
    working_dir: /opt/l2j/game
    command: ["java", "-Xms256m", "-Xmx768m", "-jar", "l2jserver.jar"]
    depends_on:
      l2j-login:
        condition: service_healthy
    ports:
      - "${L2J_BIND_IP:-0.0.0.0}:7777:7777"
    volumes:
      - ./deploy/game/log:/opt/l2j/game/log
      - ./deploy/generated/game/config:/opt/l2j/game/config
      # User-installed geodata (see scripts/*fetch-geodata*).
      - ./deploy/game/data/geodata:/opt/l2j/game/data/geodata:ro
      - ./deploy/game/data/pathnode:/opt/l2j/game/data/pathnode:ro
      # Clan crests and clan data the game writes while it runs.
      - winterrealm3-crests:/opt/l2j/game/data/crests
      - winterrealm3-clans:/opt/l2j/game/data/clans
    healthcheck:
      # Healthy once players can connect to the world.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7777"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s

volumes:
  winterrealm3-db:
  winterrealm3-crests:
  winterrealm3-clans:
