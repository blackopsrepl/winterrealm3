# ---------------------------------------------------------------------------
# Native player bots
# ---------------------------------------------------------------------------

# Load enabled character_bots rows as real clientless player characters.
# Keep disabled until bot metadata has been installed and populated.
BotsEnabled = false

# One shared pulse admits due bot decisions onto the existing AI executor.
# Foreground includes combat, active party combat, and nearby human players.
BotSchedulerPulseMillis = 100
BotForegroundDecisionMillis = 250
BotBackgroundDecisionMillis = 2000

# Independent bounds prevent either one pulse or queued bot work from growing
# without limit. In-flight includes decisions waiting in the AI executor.
BotMaxDispatchPerPulse = 16
BotMaxInFlightDecisions = 4
